{{define "title"}}Calls · SMS Mock{{end}}

{{define "topbar_search"}}
<form class="topbar-search" action="/calls" method="GET"
      hx-get="/ui/fragments/list" hx-target="#record-list" hx-swap="outerHTML"
      hx-trigger="keyup changed delay:300ms from:input[name='q'], submit"
      hx-include="this">
    <input type="hidden" name="type" value="calls">
    <input type="hidden" name="status" value="{{ .Status }}">
    <input type="search" name="q" value="{{ .Q }}" placeholder="Search from / to..." autocomplete="off">
</form>
{{end}}

{{define "sidebar"}}
{{template "fragments/sidebar.html" .}}
{{end}}

{{define "content"}}
{{template "fragments/list.html" .}}
{{end}}
