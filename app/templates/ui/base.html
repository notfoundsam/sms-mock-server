<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}SMS Mock Server{{end}}</title>
    <link rel="stylesheet" href="{{ assetUrl "/static/css/style.css" }}">
    <script src="{{ assetUrl "/static/js/htmx.min.js" }}"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>SMS Mock Server</h1>
            <div class="provider">Provider: {{ upper .Provider }} | Timezone: {{ .Timezone }}</div>
        </div>
    </header>

    <div class="container">
        <nav>
            <ul>
                <li><a href="/" {{if eq .Path "/"}}class="active"{{end}}>Dashboard</a></li>
                <li><a href="/ui/messages" {{if hasPrefix .Path "/ui/messages"}}class="active"{{end}}>Messages</a></li>
                <li><a href="/ui/calls" {{if hasPrefix .Path "/ui/calls"}}class="active"{{end}}>Calls</a></li>
                <li><a href="/ui/callbacks" {{if hasPrefix .Path "/ui/callbacks"}}class="active"{{end}}>Callbacks</a></li>
            </ul>
        </nav>

        {{block "content" .}}{{end}}
    </div>

    <!-- Modal container -->
    <div id="modal" class="modal-overlay" onclick="if(event.target === this) this.classList.remove('show')">
        <div class="modal-content" id="modal-content">
            <!-- Modal content loaded via HTMX -->
        </div>
    </div>

    <script src="{{ assetUrl "/static/js/app.js" }}"></script>
</body>
</html>
