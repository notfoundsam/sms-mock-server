<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}SMS Mock{{end}}</title>
    <link rel="stylesheet" href="{{ assetUrl "/static/css/style.css" }}">
    <script src="{{ assetUrl "/static/js/htmx.min.js" }}"></script>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="topbar-brand">SMS Mock</div>
            {{block "topbar_search" .}}{{end}}
            <div class="topbar-meta">{{ upper .Provider }} · {{ .Timezone }}</div>
        </header>

        <aside class="sidebar">
            {{block "sidebar" .}}{{end}}
        </aside>

        <main class="main">
            {{block "content" .}}{{end}}
        </main>
    </div>

    <script src="{{ assetUrl "/static/js/app.js" }}"></script>
</body>
</html>
