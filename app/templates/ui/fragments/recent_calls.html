<div hx-get="/ui/fragments/recent-calls" hx-trigger="every 3s" hx-swap="outerHTML">
{{if .RecentCalls}}
<table>
    <thead>
        <tr>
            <th>SID</th>
            <th>From</th>
            <th>To</th>
            <th>Status</th>
            <th>Created</th>
        </tr>
    </thead>
    <tbody>
        {{range .RecentCalls}}
        <tr onclick="showCallDetail('{{ .SID }}')" style="cursor: pointer;">
            <td><code>{{ truncate .SID 20 }}</code></td>
            <td class="phone">{{ .From }}</td>
            <td class="phone">{{ .To }}</td>
            <td><span class="status {{ .Status }}">{{ .Status }}</span></td>
            <td class="timestamp">{{ formatTime .CreatedAt }}</td>
        </tr>
        {{end}}
    </tbody>
</table>
{{else}}
<div class="empty-state">
    <p>No calls yet. Make your first call to get started!</p>
</div>
{{end}}
</div>
