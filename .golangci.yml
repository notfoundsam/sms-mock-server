version: "2"
run:
  concurrency: 4
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - gochecknoinits
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - prealloc
    - reassign
    - revive
    - sqlclosecheck
    - staticcheck
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    dupl:
      threshold: 100
    gocritic:
      disabled-checks:
        - wrapperFunc
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - performance
        - style
        - experimental
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    revive:
      rules:
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: empty-block
        - name: redefines-builtin-id

  exclusions:
    generated: lax
    rules:
      # Test files: relax a few common-and-noisy checks.
      - linters:
          - revive
          - unparam
          - unused
        path: _test\.go$
        text: unused-parameter
      - linters:
          - dupl
          - noctx
          - usestdlibvars
          - wrapcheck
          - gosec
          - bodyclose
          - intrange
          - unparam
          - errcheck
          - gocritic
          - govet  # in particular: shadow on `if err := ...` is a stdlib idiom
        path: _test\.go$
      # The fakes in app/testutil/ are test infrastructure — don't apply
      # production-code rules like wrapcheck or noctx to them.
      - linters:
          - dupl
          - wrapcheck
          - noctx
          - unparam
        path: app/testutil/
      # Closing rows.Close, resp.Body.Close etc. — error often legitimately ignored.
      - linters:
          - errcheck
        text: "Error return value of .*\\.Close.*is not checked"
      # Don't require package comments on every file (one per package is fine).
      - linters:
          - revive
        text: should have a package comment
      - linters:
          - staticcheck
        text: at least one file in a package should have a package comment
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
