services:
  sms-mock-server:
    build: .
    container_name: sms-mock-server
    ports:
      - "8080:8080"
    volumes:
      # Override the embedded config without rebuilding the image.
      - ./config.yaml:/app/config.yaml
      # Persist SQLite DB across container restarts.
      - sms-mock-data:/app/data
    environment:
      - LOG_LEVEL=INFO
    networks:
      - sms-mock-network
    # Note: distroless/static base image has no shell or curl/wget, so the
    # classic shell-based HEALTHCHECK doesn't work. Compose still waits for
    # the container to start and the port to bind, which is sufficient for
    # `depends_on` semantics. If a healthcheck is required, build a tiny
    # healthcheck binary into the image and call it here.
    restart: unless-stopped

networks:
  sms-mock-network:
    driver: bridge

volumes:
  sms-mock-data:
