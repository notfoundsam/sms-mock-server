name: build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
        id: go

      - name: build and test
        run: |
          go test -race -timeout=120s -covermode=atomic -coverprofile=$GITHUB_WORKSPACE/profile.cov_tmp ./...
          grep -v -E "/testutil/" $GITHUB_WORKSPACE/profile.cov_tmp > $GITHUB_WORKSPACE/profile.cov

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: "v2.12"

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: profile.cov
